apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

helmCharts:
  - repo: https://traefik.github.io/charts
    name: traefik
    namespace: traefik
    version: 40.2.0
    releaseName: traefik
    valuesFile: values-40.2.0.yaml

patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/service.beta.kubernetes.io~1upcloud-load-balancer-config
        value: |
          {
            "name": "dev",
            "plan": "essentials",
            "frontends": [
              {
                "name": "websecure",
                "mode": "tcp",
                "port": 443
              },
              {
                "name": "web",
                "mode": "tcp",
                "port": 80
              }
            ]
          }
    target:
      kind: Service
      name: traefik