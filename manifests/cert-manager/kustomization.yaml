apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
- letsencrypt-clusterissuer.yaml

helmCharts:
- name: cert-manager
  namespace: cert-manager
  version: 1.20.2
  releaseName: cert-manager
  repo: https://charts.jetstack.io
  valuesInline:
    enableCertificateOwnerRef: true
    installCRDs: true
